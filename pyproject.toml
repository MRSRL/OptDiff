[project]
name = "optdiff"
version = "0.1.0"
description = "OptDiff diffusion-based reconstruction for MRI and natural images, with the baselines it is compared against"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    # Pinned: these versions produced the reference runs, and other versions can change the results
    "torch==1.12.1",  # CUDA 11.6 build, from the PyTorch index below
    "torchvision==0.13.1",
    "numpy==1.20.3",
    "scipy==1.10.1",  # optimal weights use scipy.optimize.nnls, which SciPy 1.12 reimplemented
    "scikit-image==0.19.3",  # SSIM
    "pillow==9.4.0",  # natural-image loading resizes with PIL
    "lpips==0.1.4",
    "hydra-core==1.3.2",  # config composition differs between Hydra versions
    "omegaconf==2.3.0",
    "h5py",
    "tqdm",
    "pyyaml",
    "requests",
    "matplotlib",
]

[tool.uv]
package = false  # scripts and modules run from the repository root; nothing to build
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]  # the CUDA wheels are Linux x86-64 only

[tool.uv.sources]
torch = { index = "pytorch-cu116" }
torchvision = { index = "pytorch-cu116" }

[[tool.uv.index]]
name = "pytorch-cu116"
url = "https://download.pytorch.org/whl/cu116"
explicit = true
