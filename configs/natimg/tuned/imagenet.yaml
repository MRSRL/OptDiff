# Tuned values for ImageNet, per task (data_config.deg) and number of steps (noise_schedule_config.num_steps).
# scripts/run_optdiff_comparisons_natimg.py passes the entry <deg>.steps<num_steps> to main_natimg.py as
# command-line overrides (utils/task_config.py). data_config holds the task's measurement noise (std, images in
# [-1, 1]); an optdiff block holds the values of the config sections it fills, a ddnm / diffpir / dps / ddrm /
# reddiff block those of baseline_config.

sr4:
  data_config: {input_noise: 0.02}
  steps20:
    optdiff:
      optimizer_config: {weights: heuristics, momentum: true, preconditioner: true, initial_estimate: cg_recon, normalize_obs: false}
      noise_schedule_config: {sigma_max: 5, sigma_min: 0.08, rho: -7}
      optimizer_weights_config:
        alpha: {function: linear, parameters: [-0.256516, 5.7207276]}
        lamda: {function: constant, parameters: 2.5061100871006348}
        beta: {function: linear, parameters: [-0.04275091, 0.89096716]}
    ddnm: {eta: 0.85}
    diffpir: {lamb: 2.0, zeta: 0.8}
    reddiff: {lr: 0.1, grad_term_weight: 0.215, denoise_term_weight: sqrt}
  steps100:
    optdiff:
      optimizer_config: {weights: heuristics, momentum: true, preconditioner: false, initial_estimate: cg_recon, normalize_obs: false}
      noise_schedule_config: {sigma_max: 5, sigma_min: 0.02, rho: -3}
      optimizer_weights_config:
        alpha: {function: exp, parameters: [41.89922807, 0.047697, 0.0]}
        beta: {function: exp, parameters: [1.5, 0.0665, 0.0]}
        lamda: {function: constant, parameters: 0.5}
    ddnm: {eta: 0.85}
    diffpir: {lamb: 2.0, zeta: 0.5}
    dps: {eta: 0.8, grad_term_weight: 10.0}
    ddrm: {eta: 1.0, eta_b: 1.0}
    reddiff: {lr: 0.3, grad_term_weight: 0.1, denoise_term_weight: sqrt}

