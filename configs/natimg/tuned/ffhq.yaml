# Tuned values for FFHQ, per task (data_config.deg) and number of steps (noise_schedule_config.num_steps).
# scripts/run_optdiff_comparisons_natimg.py passes the entry <deg>.steps<num_steps> to main_natimg.py as
# command-line overrides (utils/task_config.py). data_config holds the task's measurement noise (std, images in
# [-1, 1]); an optdiff block holds the values of the config sections it fills, a ddnm / diffpir / dps / ddrm /
# reddiff block those of baseline_config.

sr4:
  data_config: {input_noise: 0.01}
  steps20:
    optdiff:
      optimizer_config: {weights: heuristics, momentum: true, preconditioner: true, initial_estimate: cg_recon, normalize_obs: false}
      noise_schedule_config: {sigma_max: 1.6, sigma_min: 0.06, rho: -5}
      optimizer_weights_config:
        alpha: {function: linear, parameters: [-0.26361129, 5.24158061]}
        beta: {function: constant, parameters: 0.31786275925046276}
        lamda: {function: constant, parameters: 1.398}
    ddnm: {eta: 0.85}
    diffpir: {lamb: 5.0, zeta: 1.0}
    reddiff: {lr: 0.1, grad_term_weight: 0.215, denoise_term_weight: sqrt}
  steps100:
    optdiff:
      optimizer_config: {weights: heuristics, momentum: true, preconditioner: true, initial_estimate: cg_recon, normalize_obs: false}
      noise_schedule_config: {sigma_max: 2, sigma_min: 0.01, rho: -7}
      optimizer_weights_config:
        alpha: {function: linear_2, parameters: [[-0.080288, 4.886999], 53, [-0.013905, 1.348]]}
        beta: {function: linear, parameters: [-0.013052, 0.767665]}
        lamda: {function: constant, parameters: 1.43}
    ddnm: {eta: 0.85}
    diffpir: {lamb: 1.0, zeta: 0.8}
    dps: {eta: 0.8, grad_term_weight: 8.0}
    ddrm: {eta: 1.0, eta_b: 1.0}
    reddiff: {lr: 0.1, grad_term_weight: 0.25, denoise_term_weight: log}

