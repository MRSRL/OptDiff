# @package _global_
# Values marked ??? are required.
optimizer_config:
  algo: diffpir
  weights: diffpir
  order: 1
  alpha_from_sigma_mode: edm
  momentum: false
  preconditioner: false
  initial_estimate: cg_recon
  num_noise_instances: 1
  seed: 0
  num_steps: ${noise_schedule_config.num_steps}
  diffpir_lambda: ???  # HQS regularization weight (rho_t = 2 * lambda * sigma_n^2 / sigma_t^2)
  diffpir_sigma_n: 1.0  # assumed measurement noise level
  diffpir_xi: ???  # DDIM stochasticity (0 = deterministic, 1 = fully stochastic)
  diffpir_proximal: gradient  # data proximal step: gradient (one step) or cg (exact solve)
  diffpir_cg_iters: 30  # with diffpir_proximal: cg
